name: Ollama
description: Run open-source large language models (Llama, Mistral, etc.) locally on your machine.
depends:
  - WinGet
script: |
  winget install --id Ollama.Ollama -e --accept-package-agreements --accept-source-agreements
  setx OPENAI_API_KEY "ollama"
  setx OLLAMA_KV_CACHE_TYPE "q4_0"