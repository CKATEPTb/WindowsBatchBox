name: GlazeWM
description: A dynamic tiling window manager for Windows inspired by i3wm.
depends:
  - WinGet
  - VCTools (C++ Build Tools)
  - cargo
script: |
  winget install --id glzr-io.glazewm -e --accept-package-agreements --accept-source-agreements
  cargo install --git https://github.com/Dutch-Raptor/GAT-GWM.git --features=no_console