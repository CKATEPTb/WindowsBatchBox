name: "GlazeWM "
description: Tiling manager designed to replicate popshell experience. Intended for use with PowerToys.
depends:
  - GlazeWM
  - VCTools (C++ Build Tools)
  - cargo
script: |
  cargo install --git https://github.com/Dutch-Raptor/GAT-GWM.git --features=no_console
  taskkill /F /IM GlazeWM* /T
  for %%I in ("%SCRIPT_SOURCE%") do set "SCRIPT_FOLDER=%%~dpI"
  powershell -command "Expand-Archive -Path '%SCRIPT_FOLDER%\GlazeWM.zip' -DestinationPath '%USERPROFILE%' -Force"