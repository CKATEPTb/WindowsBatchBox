name: Classic Context Menu
description: Restores the legacy Windows 10 right-click context menu by disabling the Windows 11 simplified menu. Restarts Explorer to apply immediately.
depends: []
script: |
    reg add "HKCU\Software\Classes\CLSID\{86ca1aa0-34aa-4e8b-a509-50c905bae2a2}\InprocServer32" /f /ve
    taskkill /IM explorer.exe /f
    explorer.exe